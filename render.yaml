services:
  - type: web
    name: ethiopic-handwriting-api
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn unified_server_with_lm:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MAX_STROKES
        value: 60
      - key: DEVICE
        value: cpu